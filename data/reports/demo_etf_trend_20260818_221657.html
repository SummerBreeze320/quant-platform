<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>Backtest Report - demo_etf_trend</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; margin: 20px; background: #f5f5f5; }
  .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 8px; }
  h1 { color: #1a1a2e; border-bottom: 2px solid #16213e; padding-bottom: 10px; }
  .metrics { width: 100%; border-collapse: collapse; margin: 20px 0; }
  .metrics td { padding: 8px 12px; border: 1px solid #ddd; }
  .metrics td:first-child { font-weight: bold; background: #f8f9fa; width: 40%; }
  #nav-chart { width: 100%; height: 400px; margin: 20px 0; }
</style>
</head>
<body>
<div class="container">
<h1>Backtest Report: demo_etf_trend</h1>
<div id="nav-chart"></div>
<h2>Performance Metrics</h2>
<table class="metrics">
<tr><td>annual_return</td><td>0.1309</td></tr>
<tr><td>sharpe_ratio</td><td>0.9279</td></tr>
<tr><td>max_drawdown</td><td>-0.1653</td></tr>
<tr><td>win_rate</td><td>0.5147</td></tr>
<tr><td>turnover</td><td>None</td></tr>
<tr><td>total_days</td><td>1191.0000</td></tr>
<tr><td>total_return</td><td>0.7883</td></tr>
</table>
</div>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script>
  var navData = [];
  var chart = echarts.init(document.getElementById("nav-chart"));
  chart.setOption({
    title: { text: "Net Asset Value" },
    tooltip: { trigger: "axis" },
    xAxis: { type: "category", data: navData.map(function(d) { return d.date; }) },
    yAxis: { type: "value", scale: true },
    series: [{
      type: "line",
      data: navData.map(function(d) { return d.nav; }),
      showSymbol: false,
      lineStyle: { width: 2 }
    }]
  });
</script>
</body>
</html>
