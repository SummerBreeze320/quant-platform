# RD-Agent 配置
rd_agent:
  # LLM后端配置
  llm:
    # 可选: openai | anthropic | deepseek | local
    provider: deepseek
    model: deepseek-chat
    api_key: ""  # 从环境变量读取: DEEPSEEK_API_KEY
    base_url: https://api.deepseek.com/v1
    # 备选: openai
    # provider: openai
    # model: gpt-4o
    # api_key: ""  # 环境变量: OPENAI_API_KEY
    # base_url: https://api.openai.com/v1
    temperature: 0.3
    max_tokens: 4096

  # 因子挖掘配置
  factor_mining:
    # 研究方向: 量价 | 基本面 | 情绪 | 混合
    research_domain: mixed
    # 初始因子模板
    factor_templates:
      - momentum      # 动量类
      - reversal      # 反转类
      - volatility    # 波动率类
      - volume        # 量能类
      - liquidity     # 流动性类
      - fundamental    # 基本面类
    # 每轮迭代生成因子数量
    factors_per_round: 5
    # 最大迭代轮数
    max_iterations: 10
    # 因子筛选标准
    ic_threshold: 0.02       # IC绝对值阈值
    icir_threshold: 0.3      # ICIR阈值
    turnover_threshold: 0.5  # 换手率阈值
    # 因子去相关
    correlation_threshold: 0.7  # 因子间相关性阈值

  # 数据配置 — 指向Qlib数据目录
  data:
    qlib_config: ./config/qlib_config.yaml
    qlib_bin_dir: ./data/qlib_bin
    # 回测区间
    train_start: 2015-01-01
    train_end: 2020-12-31
    valid_start: 2021-01-01
    valid_end: 2022-12-31
    test_start: 2023-01-01
    test_end: 2026-08-18

  # 输出配置
  output:
    factor_dir: ./data/factors      # 生成的因子代码
    report_dir: ./data/reports      # 因子评估报告
    log_dir: ./logs/rd_agent        # RD-Agent运行日志

  # ETF因子挖掘(自定义场景)
  etf_factor:
    enable: true
    research_domain: trend  # 趋势类为主
    factor_templates:
      - ma_cross       # 均线交叉
      - breakout       # 突破
      - mean_revert    # 均值回归
      - volatility     # 波动率
