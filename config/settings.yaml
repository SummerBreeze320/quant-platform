# Quant Platform 全局配置 — v0.3.0 七层架构
project:
  name: quant-platform
  version: 0.3.0
  root_dir: d:\BaiduSyncdisk\PycharmProjects\quant-platform

# 七层架构
architecture:
  layers:
    - data          # 数据层: Wind→Qlib bin
    - factor        # 因子层: Qlib表达式引擎
    - model         # 模型层: LightGBM/XGBoost + MLflow
    - strategy      # 策略层: TopK/增强指数/ETF轮动
    - backtest      # 回测层: Qlib Simulator + 归因
    - execution     # 执行层: 信号→调度→网关→风控
    - dashboard     # 展示层: FastAPI + ECharts + WebSocket
  modules:
    - qlib
    - rd_agent
    - mlflow
    - research_workflow
    - unified_risk
    - enhanced_indexing

# 数据目录
data:
  qlib_bin_dir: ./data/qlib_bin
  raw_dir: ./data/raw
  cache_dir: ./data/cache
  models_dir: ./data/models
  trade_logs_dir: ./data/trade_logs

# MySQL (可选 — 持久化策略/回测结果)
mysql:
  host: 127.0.0.1
  port: 3306
  user: root
  password: "123456"
  database: quant_platform
  pool_size: 5
  pool_recycle: 3600

# MLflow (实验跟踪)
mlflow:
  tracking_uri: http://localhost:5000
  experiment_name: quant_platform
  artifact_location: ./data/mlruns

# RD-Agent
rd_agent:
  work_dir: ./data/rd_agent_workspace
  llm_backend: openai
  llm_model: gpt-4o
  max_iterations: 10

# 日志
logging:
  level: INFO
  format: "%(asctime)s [%(levelname)s] %(name)s: %(message)s"
  file: ./logs/app.log

# Dashboard
dashboard:
  host: 0.0.0.0
  port: 8000
  version: 0.3.0
  websocket_path: /ws/realtime
  topics:
    - market
    - risk
    - trades
    - system
