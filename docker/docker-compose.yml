version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quant_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-quant_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quant_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-quant_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ../data/postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quant_user}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: quant_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - ../data/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # RD-Agent sandbox: Docker-in-Docker for isolated factor code execution.
  # rdagent uses this container to run generated factor expressions safely.
  # Requires: docker.sock mounted from host.
  rdagent-sandbox:
    image: docker:24-dind
    container_name: rdagent_sandbox
    restart: always
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../data/rdagent_workspace:/workspace
    ports:
      - "2376:2376"
